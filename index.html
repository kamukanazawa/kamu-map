<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- KML/KMZ 直接読み込みプラグイン -->
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    #map { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="locateUser()">📍 現在地を表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地にジャンプします</div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // 金沢周辺を中心に初期表示
    const map = L.map('map').setView([36.5613, 136.6562], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userLocationMarker = null;
    let userLocationAccuracyCircle = null;

    // KAMU kanazawa マイマップデータ読み込み（Google直接アクセス）
    const kmlUrl = 'https://www.google.com/maps/d/kml?forcekml=1&mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U';
    
    // omnivoreライブラリを使用してKMLを解析・描画
    const runLayer = omnivore.kml(kmlUrl)
      .on('ready', function() {
        // 全ピンが画面に収まるように自動ズーム調整
        map.fitBounds(runLayer.getBounds());
        
        // ピンにポップアップ（スポット名）を追加
        runLayer.eachLayer(function(layer) {
          if (layer.feature && layer.feature.properties) {
            let name = layer.feature.properties.name || '';
            let desc = layer.feature.properties.description || '';
            if (name) {
              layer.bindPopup(`<strong>${name}</strong><br><span style="font-size:12px;color:#555;">${desc}</span>`);
            }
          }
        });
      })
      .addTo(map);

    // 位置情報（GPS）取得
    function locateUser() {
      const btn = document.getElementById('geoBtn');
      const status = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報に対応していません。");
        return;
      }

      status.innerText = "現在地を取得中...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationAccuracyCircle) map.removeLayer(userLocationAccuracyCircle);

          userLocationAccuracyCircle = L.circle([lat, lng], {
            radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, weight: 3
          }).addTo(map).bindPopup('現在の場所').openPopup();

          map.setView([lat, lng], 16);
          status.innerText = "現在地を表示しました！";
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          status.innerText = "⚠️ 位置情報の利用を許可してください。";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
