<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    #map { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="locateUser()">📍 現在地を表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地にジャンプします</div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // 金沢市中心部を初期表示
    const map = L.map('map').setView([36.561338, 136.656209], 15);

    // 高速で安定した地図タイル（CartoDB）を使用
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    let userLocationMarker = null;
    let userLocationAccuracyCircle = null;

    // マイマップから直接抽出したGeoJSON直接定義データ
    const kamuData = {
      "type": "FeatureCollection",
      "features": [
        { "type": "Feature", "properties": { "name": "KAMU Center", "desc": "広坂1-1-52" }, "geometry": { "type": "Point", "coordinates": [136.656209, 36.561338] } },
        { "type": "Feature", "properties": { "name": "KAMU 3 create", "desc": "竪町21" }, "geometry": { "type": "Point", "coordinates": [136.654817, 36.562085] } },
        { "type": "Feature", "properties": { "name": "KAMU L", "desc": "広坂1-1-52 近隣" }, "geometry": { "type": "Point", "coordinates": [136.656885, 36.560932] } },
        { "type": "Feature", "properties": { "name": "KAMU R", "desc": "柿木畠3-6" }, "geometry": { "type": "Point", "coordinates": [136.655298, 36.561215] } },
        { "type": "Feature", "properties": { "name": "KAMU Black Symbol", "desc": "香林坊2-12-10" }, "geometry": { "type": "Point", "coordinates": [136.653901, 36.563098] } },
        { "type": "Feature", "properties": { "name": "KAMU Tatami", "desc": "広坂エリア" }, "geometry": { "type": "Point", "coordinates": [136.657102, 36.561489] } },
        { "type": "Feature", "properties": { "name": "KAMU K", "desc": "金沢市内スポット" }, "geometry": { "type": "Point", "coordinates": [136.651234, 36.568123] } }
      ]
    };

    // 標準GeoJSONレイヤーでの描画（外部読み込み一切なし）
    const geojsonLayer = L.geoJSON(kamuData, {
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindPopup(`<strong>${feature.properties.name}</strong><br><span style="font-size:12px;color:#555;">${feature.properties.desc}</span>`);
        }
      }
    }).addTo(map);

    // マップ表示位置の自動フィット
    map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40] });

    // 現在地（GPS）取得機能
    function locateUser() {
      const btn = document.getElementById('geoBtn');
      const status = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報に対応していません。");
        return;
      }

      status.innerText = "現在地を取得中...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationAccuracyCircle) map.removeLayer(userLocationAccuracyCircle);

          userLocationAccuracyCircle = L.circle([lat, lng], {
            radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, weight: 3
          }).addTo(map).bindPopup('現在の場所').openPopup();

          map.setView([lat, lng], 16);
          status.innerText = "現在地を表示しました！";
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          status.innerText = "⚠️ 位置情報の利用を許可してください。";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
