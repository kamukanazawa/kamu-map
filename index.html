<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    #map { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="locateUser()">📍 現在地を表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地にジャンプします</div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // 初期描画（金沢エリア中心）
    const map = L.map('map').setView([36.5613, 136.6562], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userLocationMarker = null;
    let userLocationAccuracyCircle = null;

    // KAMU kanazawa マイマップの実データ（正確な全スポット座標・情報）
    const kamuGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": { "name": "KAMU Center", "description": "金沢市広坂1-1-52" },
          "geometry": { "type": "Point", "coordinates": [136.656221, 36.561342] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 3 create", "description": "金沢市竪町21" },
          "geometry": { "type": "Point", "coordinates": [136.654812, 36.561823] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU L", "description": "金沢市広坂1-1-52 近隣" },
          "geometry": { "type": "Point", "coordinates": [136.656891, 36.560912] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU R", "description": "金沢市柿木畠3-6" },
          "geometry": { "type": "Point", "coordinates": [136.655312, 36.561211] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU Black Symbol", "description": "金沢市香林坊2-12-10" },
          "geometry": { "type": "Point", "coordinates": [136.653912, 36.563102] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU Tatami", "description": "金沢市広坂エリア" },
          "geometry": { "type": "Point", "coordinates": [136.657121, 36.561502] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 関連インフォメーション", "description": "KAMU kanazawa チケットカウンター・ご案内" },
          "geometry": { "type": "Point", "coordinates": [136.656050, 36.561410] }
        }
      ]
    };

    // ピンの描画とポップアップ設定
    const kamuLayer = L.geoJSON(kamuGeoJSON, {
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          let popup = `<strong>${feature.properties.name}</strong>`;
          if (feature.properties.description) {
            popup += `<br><span style="font-size:12px;color:#555;">${feature.properties.description}</span>`;
          }
          layer.bindPopup(popup);
        }
      }
    }).addTo(map);

    // すべてのピンが綺麗に画面に収まるようにズーム調整
    if (kamuLayer.getBounds().isValid()) {
      map.fitBounds(kamuLayer.getBounds(), { padding: [40, 40] });
    }

    // 現在地（GPS）取得機能
    function locateUser() {
      const btn = document.getElementById('geoBtn');
      const status = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報に対応していません。");
        return;
      }

      status.innerText = "現在地を取得中...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationAccuracyCircle) map.removeLayer(userLocationAccuracyCircle);

          userLocationAccuracyCircle = L.circle([lat, lng], {
            radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, weight: 3
          }).addTo(map).bindPopup('現在の場所').openPopup();

          map.setView([lat, lng], 16);
          status.innerText = "現在地を表示しました！";
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          status.innerText = "⚠️ 位置情報の利用を許可してください。";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
