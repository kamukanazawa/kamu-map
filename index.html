<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    .legend { margin-top: 8px; display: flex; justify-content: center; gap: 12px; font-size: 11px; color: #333; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #map { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="locateUser()">📍 現在地を表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地にジャンプします</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-color" style="background:#e53935;"></span>KAMU展示会場</span>
        <span class="legend-item"><span class="legend-color" style="background:#1e88e5;"></span>TOWN hack</span>
        <span class="legend-item"><span class="legend-color" style="background:#43a047;"></span>ピザコラボ</span>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // 金沢を中心とした初期表示
    const map = L.map('map').setView([36.5613, 136.6562], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userLocationMarker = null;
    let userLocationAccuracyCircle = null;
    const allBounds = L.latLngBounds([]);

    // ご提示いただいた3つのカテゴリ（レイヤー）設定
    const categories = [
      {
        name: "KAMU美術館展示会場",
        lid: "rcxsOnhDcn4",
        color: "#e53935" // 赤色ピン
      },
      {
        name: "TOWN hack",
        lid: "LPdGaYpGTbs",
        color: "#1e88e5" // 青色ピン
      },
      {
        name: "ピザコラボショップ",
        lid: "emLMIZ1cnH0",
        color: "#43a047" // 緑色ピン
      }
    ];

    // プロキシ経由で各カテゴリのKMLを取得して描画
    const mid = "1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U";
    let loadedCount = 0;

    categories.forEach(cat => {
      const targetUrl = `https://www.google.com/maps/d/u/3/kml?forcekml=1&mid=${mid}&lid=${cat.lid}`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      fetch(proxyUrl)
        .then(res => {
          if (!res.ok) throw new Error("取得失敗");
          return res.text();
        })
        .then(kmlText => {
          const dom = new DOMParser().parseFromString(kmlText, 'text/xml');
          const geoJson = toGeoJSON.kml(dom);

          const layer = L.geoJSON(geoJson, {
            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                radius: 8,
                fillColor: cat.color,
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
              });
            },
            onEachFeature: function (feature, layer) {
              if (feature.properties && feature.properties.name) {
                let popup = `<strong>[${cat.name}]</strong><br><strong>${feature.properties.name}</strong>`;
                if (feature.properties.description) {
                  popup += `<br><span style="font-size:12px;color:#555;">${feature.properties.description}</span>`;
                }
                layer.bindPopup(popup);
              }
            }
          }).addTo(map);

          if (layer.getBounds().isValid()) {
            allBounds.extend(layer.getBounds());
          }

          loadedCount++;
          if (loadedCount === categories.length && allBounds.isValid()) {
            map.fitBounds(allBounds, { padding: [40, 40] });
          }
        })
        .catch(err => {
          console.error(`カテゴリ [${cat.name}] 読み込みエラー:`, err);
        });
    });

    // 現在地（GPS）取得処理（アプリ移行なし・ブラウザ内表示）
    function locateUser() {
      const btn = document.getElementById('geoBtn');
      const status = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報に対応していません。");
        return;
      }

      status.innerText = "現在地を取得中...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationAccuracyCircle) map.removeLayer(userLocationAccuracyCircle);

          userLocationAccuracyCircle = L.circle([lat, lng], {
            radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, weight: 3
          }).addTo(map).bindPopup('現在の場所').openPopup();

          map.setView([lat, lng], 16);
          status.innerText = "現在地を表示しました！";
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          status.innerText = "⚠️ 位置情報の利用を許可してください。";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
