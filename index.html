<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    .map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="openGoogleMaps()">📍 Googleマップアプリで現在地を開く</button>
      <div id="statusText" class="status-text">マイマップの正確なピン一覧を表示中</div>
    </div>
    <div class="map-container">
      <!-- Googleマイマップ（mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U）の純正公式埋め込み -->
      <iframe src="https://www.google.com/maps/d/embed?mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U&ehbc=2E312F"></iframe>
    </div>
  </div>

  <script>
    function openGoogleMaps() {
      // スマホのGoogle Mapsアプリ/ブラウザでマイマップを現在地とともに直接起動
      window.location.href = "https://www.google.com/maps/d/viewer?mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U";
    }
  </script>
</body>
</html>
