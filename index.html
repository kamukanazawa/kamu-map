<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; display: inline-block; text-decoration: none; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    .map-container { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button class="geo-btn" onclick="openCurrentLocationMap()">📍 現在地とルートを表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地付きのマップを開きます</div>
    </div>
    <div class="map-container">
      <!-- アプリ強制起動をブロックする sandbox 付きの純正マイマップ -->
      <iframe 
        src="https://www.google.com/maps/d/embed?mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U&ehbc=2E312F"
        sandbox="allow-scripts allow-same-origin allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>

  <script>
    function openCurrentLocationMap() {
      // Googleマップで現在地とKAMUマイマップを表示
      window.open("https://www.google.com/maps/d/viewer?mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U", "_blank");
    }
  </script>
</body>
</html>
