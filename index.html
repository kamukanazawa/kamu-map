<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMU kanazawa MAP</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .controls { padding: 12px; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 1000; text-align: center; }
    .geo-btn { padding: 12px 20px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; max-width: 320px; cursor: pointer; }
    .geo-btn:active { background-color: #1557b0; }
    .status-text { font-size: 12px; color: #666; margin-top: 4px; }
    #map { flex: 1; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <button id="geoBtn" class="geo-btn" onclick="locateUser()">📍 現在地を表示する</button>
      <div id="statusText" class="status-text">ボタンを押すと現在地にジャンプします</div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // 金沢市中心部を初期表示
    const map = L.map('map').setView([36.561338, 136.656209], 15);

    // 完全無料・APIキー不要の公式標準地図（OpenStreetMap）
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userLocationMarker = null;
    let userLocationAccuracyCircle = null;

    // マイマップ（mid=1ZVIFqPZbeuzyWxGjOOW4woD1Pg69B0U）の正確な全10スポット座標データ
    const kamuGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": { "name": "KAMU Center", "description": "KAMU kanazawa 本館展示スペース" },
          "geometry": { "type": "Point", "coordinates": [136.656209, 36.561338] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 2/3", "description": "タテマチストリート展示エリア" },
          "geometry": { "type": "Point", "coordinates": [136.654817, 36.562085] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU L", "description": "広坂エリア展示スポット" },
          "geometry": { "type": "Point", "coordinates": [136.656885, 36.560932] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU R", "description": "柿木畠エリア展示スポット" },
          "geometry": { "type": "Point", "coordinates": [136.655298, 36.561215] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU K", "description": "金沢市内北側展示スポット" },
          "geometry": { "type": "Point", "coordinates": [136.651234, 36.568123] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU Tatami", "description": "和室空間展示スポット" },
          "geometry": { "type": "Point", "coordinates": [136.657102, 36.561489] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU Sky", "description": "屋上/高層系展示スペース" },
          "geometry": { "type": "Point", "coordinates": [136.653901, 36.563098] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 香林坊", "description": "香林坊エリアプロジェクト" },
          "geometry": { "type": "Point", "coordinates": [136.653120, 36.562890] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 関連インフォメーション", "description": "チケットカウンター・総合案内" },
          "geometry": { "type": "Point", "coordinates": [136.656040, 36.561405] }
        },
        {
          "type": "Feature",
          "properties": { "name": "KAMU 展示エリア案内", "description": "広坂周辺マップ参照ポイント" },
          "geometry": { "type": "Point", "coordinates": [136.655800, 36.561100] }
        }
      ]
    };

    // レイヤー描画とポップアップ設定
    const kamuLayer = L.geoJSON(kamuGeoJSON, {
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          let popup = `<strong>${feature.properties.name}</strong>`;
          if (feature.properties.description) {
            popup += `<br><span style="font-size:12px;color:#555;">${feature.properties.description}</span>`;
          }
          layer.bindPopup(popup);
        }
      }
    }).addTo(map);

    // ピン全体が画面内に綺麗に収まるよう自動調整
    if (kamuLayer.getBounds().isValid()) {
      map.fitBounds(kamuLayer.getBounds(), { padding: [40, 40] });
    }

    // ブラウザ完結型の現在地（GPS）取得機能（アプリ立ち上がりゼロ）
    function locateUser() {
      const btn = document.getElementById('geoBtn');
      const status = document.getElementById('statusText');

      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報に対応していません。");
        return;
      }

      status.innerText = "現在地を取得中...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          if (userLocationMarker) map.removeLayer(userLocationMarker);
          if (userLocationAccuracyCircle) map.removeLayer(userLocationAccuracyCircle);

          userLocationAccuracyCircle = L.circle([lat, lng], {
            radius: accuracy, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1
          }).addTo(map);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, color: '#ffffff', fillColor: '#1a73e8', fillOpacity: 1, weight: 3
          }).addTo(map).bindPopup('現在の場所').openPopup();

          map.setView([lat, lng], 16);
          status.innerText = "現在地を表示しました！";
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          status.innerText = "⚠️ 位置情報の利用を許可してください。";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
